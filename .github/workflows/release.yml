name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'New version tag, for example v1.0.0'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test.yml
  publish:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate version and ensure release is new
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Use a stable vX.Y.Z version tag'; exit 1; }
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Release already exists; use a new version tag'
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]] && git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Tag already exists; push a new tag or choose an unused version'
            exit 1
          fi
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, dom, mbstring, xml, xmlreader, xmlwriter, zip
          tools: composer:v2
          coverage: none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build deployment package
        run: |
          composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader
          python3 tools/build.py --version "${RELEASE_TAG#v}"
          cd dist
          sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: QinDav-${{ env.RELEASE_TAG }}
          path: |
            dist/QinDav.zip
            dist/SHA256SUMS
          if-no-files-found: error
      - name: Publish GitHub release
        run: |
          gh release create "$RELEASE_TAG" dist/QinDav.zip dist/SHA256SUMS \
            --target "$GITHUB_SHA" --title "QinDav $RELEASE_TAG" --generate-notes
