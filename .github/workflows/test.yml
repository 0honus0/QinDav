name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  integration:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, dom, mbstring, xml, xmlreader, xmlwriter, zip
          tools: composer:v2
          coverage: none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          composer validate --no-check-publish
          composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader
          sudo apt-get update -qq
          sudo apt-get install -y rclone
      - name: Check PHP syntax
        run: |
          php -l index.php
          php -l dav.php
          php -l tools/router.php
      - name: Protocol, quota and rclone tests
        run: python3 tests/integration.py --rclone
      - name: Update and rollback tests
        run: |
          python3 tests/update.py
          QINDAV_TEST_OPCACHE=1 python3 tests/update.py
      - uses: actions/setup-node@v4
        if: matrix.php == '8.4'
        with:
          node-version: '22'
          cache: npm
      - name: Browser tests
        if: matrix.php == '8.4'
        run: |
          npm ci
          npx playwright install --with-deps chromium
          python3 tests/browser_upload.py
      - name: Verify deployment archive
        run: python3 tools/build.py
